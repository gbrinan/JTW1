<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Malfoy Top-Down Game</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #222; font-family: sans-serif; color: #eee; }
  canvas { max-width: 100%; height: auto; border: 4px solid #000; background: #4f9e52; }
  p { font-size: 14px; text-align: center; padding: 0 16px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<p>방향키 / WASD 이동 · Space 점프 · 헤르미온느와 해그리드를 점프로 밟기 · 물길은 점프로 건너기 · 깃발에 가면 클리어 · R 다시 시작</p>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800;
const H = 450;

// Render at device pixel ratio so the image stays sharp on retina screens
const dpr = window.devicePixelRatio || 1;
canvas.width = W * dpr;
canvas.height = H * dpr;
ctx.scale(dpr, dpr);

const TAU = Math.PI * 2;
const WORLD_W = 2400;
const WORLD_H = 900;
const TILE = 50;
const MOVE_SPEED = 3.5;
const JUMP_Z = 8;
const GRAVITY_Z = 0.45;
const PLAYER_R = 11;

// SFX-BEGIN (this block is also read by render-sfx.js to render 32-bit float WAV files)
const SFX_MASTER = 0.3;

// Icy, bell-like timbres built from sine partials: [frequency ratio, amplitude]
const SFX_INSTRUMENTS = {
  bell: { partials: [[1, 1], [2.76, 0.5], [5.4, 0.25]], decay: 0.5 },
  celesta: { partials: [[1, 1], [2, 0.35], [4, 0.12]], decay: 0.3 },
  bass: { partials: [[1, 1], [2, 0.3]], decay: 0.15 },
};

// MIDI-style note events: n = note number, t = start (s), d = length (s), v = velocity, i = instrument
const SFX = {
  jump: [
    { n: 79, t: 0, d: 0.06, v: 0.6, i: 'celesta' },
    { n: 86, t: 0.06, d: 0.12, v: 0.6, i: 'celesta' },
  ],
  stomp: [
    { n: 43, t: 0, d: 0.1, v: 0.9, i: 'bass' },
    { n: 91, t: 0.02, d: 0.1, v: 0.5, i: 'bell' },
  ],
  die: [
    { n: 76, t: 0, d: 0.12, v: 0.7, i: 'celesta' },
    { n: 72, t: 0.14, d: 0.12, v: 0.7, i: 'celesta' },
    { n: 69, t: 0.28, d: 0.12, v: 0.7, i: 'celesta' },
    { n: 64, t: 0.42, d: 0.3, v: 0.7, i: 'bell' },
    { n: 40, t: 0.42, d: 0.3, v: 0.8, i: 'bass' },
  ],
  fall: Array.from({ length: 8 }, (_, k) => ({ n: 88 - k * 3, t: k * 0.05, d: 0.06, v: 0.5, i: 'celesta' })),
  clear: [
    { n: 72, t: 0, d: 0.12, v: 0.7, i: 'celesta' },
    { n: 76, t: 0.12, d: 0.12, v: 0.7, i: 'celesta' },
    { n: 79, t: 0.24, d: 0.12, v: 0.7, i: 'celesta' },
    { n: 84, t: 0.36, d: 0.5, v: 0.8, i: 'bell' },
    { n: 88, t: 0.36, d: 0.5, v: 0.6, i: 'celesta' },
    { n: 91, t: 0.36, d: 0.5, v: 0.6, i: 'celesta' },
    { n: 48, t: 0.36, d: 0.5, v: 0.8, i: 'bass' },
  ],
};

function midiToHz(n) {
  return 440 * Math.pow(2, (n - 69) / 12);
}

function noteLength(note) {
  return note.d + SFX_INSTRUMENTS[note.i].decay;
}

// Amplitude envelope: 5ms linear attack, then an exponential decay down to 0.0001
function envelope(peak, length, lt) {
  if (lt < 0 || lt >= length) return 0;
  if (lt < 0.005) return peak * lt / 0.005;
  return peak * Math.pow(0.0001 / peak, (lt - 0.005) / (length - 0.005));
}
// SFX-END

let audioCtx = null;

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (err) {
    audioCtx = null;
  }
}

function playSfx(name) {
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  for (const note of SFX[name]) {
    const inst = SFX_INSTRUMENTS[note.i];
    const start = now + note.t;
    const end = start + noteLength(note);
    const total = inst.partials.reduce((sum, [, amp]) => sum + amp, 0);
    for (const [ratio, amp] of inst.partials) {
      const peak = note.v * SFX_MASTER * amp / total;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = midiToHz(note.n) * ratio;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(peak, start + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, end);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(end);
    }
  }
}

const keys = {};
addEventListener('keydown', e => {
  initAudio();
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });

// Water channels cut across the whole map; walk in and you fall, so jump over them
const pits = [
  { x: 620, y: 0, w: 80, h: WORLD_H },
  { x: 1240, y: 0, w: 80, h: WORLD_H },
  { x: 1800, y: 0, w: 80, h: WORLD_H },
];

// Solid stone blocks
const rocks = [
  { x: 300, y: 250, w: 60, h: 60 },
  { x: 300, y: 600, w: 60, h: 60 },
  { x: 900, y: 380, w: 80, h: 60 },
  { x: 1000, y: 600, w: 60, h: 60 },
  { x: 1500, y: 300, w: 60, h: 80 },
  { x: 1500, y: 620, w: 80, h: 60 },
  { x: 2050, y: 420, w: 60, h: 60 },
];

const flag = { x: 2300, y: 450 };

// Enemies patrol along one axis between min and max.
function makeEnemies() {
  return [
    { kind: 'hermione', r: 14, speed: 1.4, x: 400, y: 450, axis: 'y', dir: 1, min: 300, max: 600, alive: true },
    { kind: 'hagrid', r: 20, speed: 0.9, x: 1000, y: 250, axis: 'x', dir: 1, min: 800, max: 1150, alive: true },
    { kind: 'hermione', r: 14, speed: 1.4, x: 1450, y: 500, axis: 'y', dir: -1, min: 250, max: 700, alive: true },
    { kind: 'hagrid', r: 20, speed: 0.9, x: 2000, y: 300, axis: 'x', dir: 1, min: 1900, max: 2250, alive: true },
  ];
}

// Floating monsters bob up and down and drift toward the player when near.
function makeMonsters() {
  return [
    { x: 800, y: 600, t: 0 },
    { x: 1500, y: 200, t: 2 },
    { x: 2100, y: 600, t: 4 },
  ];
}

let player, enemies, monsters, cameraX, cameraY, won;

function reset() {
  player = { x: 80, y: 450, z: 0, vz: 0, face: 0, step: 0, moving: false };
  enemies = makeEnemies();
  monsters = makeMonsters();
  won = false;
}

function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

function boxHit(p, r, rect) {
  return p.x + r > rect.x && p.x - r < rect.x + rect.w && p.y + r > rect.y && p.y - r < rect.y + rect.h;
}

function inPit(p) {
  return pits.some(r => p.x > r.x && p.x < r.x + r.w && p.y > r.y && p.y < r.y + r.h);
}

function update() {
  if (keys.KeyR) { reset(); return; }
  if (won) return;

  const p = player;
  let dx = ((keys.ArrowRight || keys.KeyD) ? 1 : 0) - ((keys.ArrowLeft || keys.KeyA) ? 1 : 0);
  let dy = ((keys.ArrowDown || keys.KeyS) ? 1 : 0) - ((keys.ArrowUp || keys.KeyW) ? 1 : 0);
  p.moving = dx !== 0 || dy !== 0;
  if (p.moving) {
    const len = Math.hypot(dx, dy);
    dx /= len;
    dy /= len;
    p.face = Math.atan2(dy, dx);
    if (p.z === 0) p.step += 0.3;
  }

  // Move on the ground one axis at a time, pushing out of solid rocks
  p.x = clamp(p.x + dx * MOVE_SPEED, PLAYER_R, WORLD_W - PLAYER_R);
  for (const r of rocks) {
    if (dx !== 0 && boxHit(p, PLAYER_R, r)) p.x = dx > 0 ? r.x - PLAYER_R : r.x + r.w + PLAYER_R;
  }
  p.y = clamp(p.y + dy * MOVE_SPEED, PLAYER_R, WORLD_H - PLAYER_R);
  for (const r of rocks) {
    if (dy !== 0 && boxHit(p, PLAYER_R, r)) p.y = dy > 0 ? r.y - PLAYER_R : r.y + r.h + PLAYER_R;
  }

  // Jump along the vertical (z) axis
  if (keys.Space && p.z === 0) {
    p.vz = JUMP_Z;
    p.z = 0.01;
    playSfx('jump');
  }
  if (p.z > 0) {
    p.vz -= GRAVITY_Z;
    p.z += p.vz;
    if (p.z <= 0) { p.z = 0; p.vz = 0; }
  }

  if (p.z === 0 && inPit(p)) { playSfx('fall'); reset(); return; }

  for (const e of enemies) {
    if (!e.alive) continue;
    e[e.axis] += e.dir * e.speed;
    if (e[e.axis] < e.min || e[e.axis] > e.max) e.dir *= -1;
    if (Math.hypot(p.x - e.x, p.y - e.y) >= PLAYER_R + e.r) continue;
    if (p.z > 6 && p.vz < 0) {
      e.alive = false;
      p.vz = 6;
      playSfx('stomp');
    } else if (p.z <= 24) {
      playSfx('die');
      reset();
      return;
    }
  }

  for (const m of monsters) {
    m.t += 0.05;
    const dist = Math.hypot(p.x - m.x, p.y - m.y);
    if (dist < 320 && dist > 0) {
      m.x += (p.x - m.x) / dist * 0.9;
      m.y += (p.y - m.y) / dist * 0.9;
    }
    if (dist < 28 && p.z < 40) { playSfx('die'); reset(); return; }
  }

  if (Math.hypot(p.x - flag.x, p.y - flag.y) < 40) {
    won = true;
    playSfx('clear');
  }
}

function drawGround() {
  const tx0 = Math.floor(cameraX / TILE);
  const tx1 = Math.ceil((cameraX + W) / TILE);
  const ty0 = Math.floor(cameraY / TILE);
  const ty1 = Math.ceil((cameraY + H) / TILE);
  for (let ty = ty0; ty < ty1; ty++) {
    for (let tx = tx0; tx < tx1; tx++) {
      ctx.fillStyle = (tx + ty) % 2 ? '#4f9e52' : '#58a95b';
      ctx.fillRect(tx * TILE, ty * TILE, TILE, TILE);
    }
  }
}

function drawPit(r) {
  const g = ctx.createLinearGradient(r.x, 0, r.x + r.w, 0);
  g.addColorStop(0, '#0a1a2a');
  g.addColorStop(0.5, '#11334f');
  g.addColorStop(1, '#0a1a2a');
  ctx.fillStyle = g;
  ctx.fillRect(r.x, r.y, r.w, r.h);

  // Icy rims
  ctx.fillStyle = '#d6eef8';
  ctx.fillRect(r.x - 4, r.y, 4, r.h);
  ctx.fillRect(r.x + r.w, r.y, 4, r.h);

  // Ripples
  ctx.strokeStyle = 'rgba(160, 210, 240, 0.25)';
  ctx.lineWidth = 2;
  for (let y = Math.floor(cameraY / 40) * 40; y < cameraY + H; y += 40) {
    ctx.beginPath();
    ctx.moveTo(r.x + 10, y);
    ctx.lineTo(r.x + r.w - 10, y + 6);
    ctx.stroke();
  }
}

function drawShadow(x, y, radius, z) {
  const k = Math.max(0.3, 1 - z / 160);
  ctx.fillStyle = `rgba(0, 0, 0, ${0.3 * k})`;
  ctx.beginPath();
  ctx.ellipse(x, y + 3, radius * k, radius * 0.55 * k, 0, 0, TAU);
  ctx.fill();
}

function drawRock(r) {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
  ctx.fillRect(r.x + 5, r.y + 7, r.w, r.h);
  const g = ctx.createLinearGradient(r.x, r.y, r.x + r.w, r.y + r.h);
  g.addColorStop(0, '#b8bdc6');
  g.addColorStop(1, '#6f747d');
  ctx.fillStyle = g;
  ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.lineWidth = 2;
  ctx.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
}

function drawFlag() {
  drawShadow(flag.x, flag.y, 10, 0);
  ctx.strokeStyle = '#ddd';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(flag.x, flag.y);
  ctx.lineTo(flag.x, flag.y - 70);
  ctx.stroke();
  ctx.fillStyle = '#2ecc40';
  ctx.beginPath();
  ctx.moveTo(flag.x + 2, flag.y - 68);
  ctx.lineTo(flag.x + 40, flag.y - 55);
  ctx.lineTo(flag.x + 2, flag.y - 42);
  ctx.closePath();
  ctx.fill();
}

function enemyFacing(e) {
  return e.axis === 'x' ? (e.dir > 0 ? 0 : Math.PI) : (e.dir > 0 ? Math.PI / 2 : -Math.PI / 2);
}

// Chibi enemy seen from above, 3 heads tall: a huge head on a tiny body
function drawHermione(e) {
  const step = Math.sin((e.x + e.y) * 0.15) * 3;

  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.rotate(enemyFacing(e) + Math.PI / 2);

  // Shoes and small black robe
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(-4, 9 + step, 3.5, 4.5, 0, 0, TAU);
  ctx.ellipse(4, 9 - step, 3.5, 4.5, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.ellipse(0, 2, 9, 7, 0, 0, TAU);
  ctx.fill();

  // Gryffindor scarf ring (red with gold stripes)
  ctx.strokeStyle = '#b3141c';
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.ellipse(0, -3, 8, 5, 0, 0, TAU);
  ctx.stroke();
  ctx.strokeStyle = '#f0b400';
  ctx.setLineDash([3, 10]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Book carried at her side
  ctx.fillStyle = '#7a1f1f';
  ctx.fillRect(8, -8, 7, 10);
  ctx.fillStyle = '#f5ecd0';
  ctx.fillRect(14, -8, 1.5, 10);

  // Big head: face, then a bushy brown hair mass around the back and sides
  ctx.fillStyle = '#f0c9a8';
  ctx.beginPath();
  ctx.arc(0, -6, 10.5, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#6b4423';
  for (let i = 0; i < 9; i++) {
    const a = Math.PI * (0.02 + i * 0.12);
    ctx.beginPath();
    ctx.arc(Math.cos(a) * 10, -1 + Math.sin(a) * 10, 4.8, 0, TAU);
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(0, -1, 10.8, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(220, 170, 110, 0.55)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(0, -1, 8, Math.PI * 0.2, Math.PI * 0.8);
  ctx.stroke();

  // Eyes on the visible forehead edge
  ctx.fillStyle = '#3a2412';
  ctx.beginPath();
  ctx.arc(-3.5, -13.8, 0.9, 0, TAU);
  ctx.arc(3.5, -13.8, 0.9, 0, TAU);
  ctx.fill();

  ctx.restore();
}

// Bigger chibi enemy: broad coat, wild black hair and beard, pink umbrella
function drawHagrid(e) {
  const step = Math.sin((e.x + e.y) * 0.1) * 3;

  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.rotate(enemyFacing(e) + Math.PI / 2);
  ctx.lineCap = 'round';

  // Big boots
  ctx.fillStyle = '#1a1008';
  ctx.beginPath();
  ctx.ellipse(-7, 14 + step, 5, 6.5, 0, 0, TAU);
  ctx.ellipse(7, 14 - step, 5, 6.5, 0, 0, TAU);
  ctx.fill();

  // Huge moleskin coat
  const coat = ctx.createRadialGradient(-5, -3, 2, 0, 0, 22);
  coat.addColorStop(0, '#6a4a2e');
  coat.addColorStop(1, '#2f2014');
  ctx.fillStyle = coat;
  ctx.beginPath();
  ctx.ellipse(0, 2, 18, 12.5, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(0, 4);
  ctx.lineTo(0, 13.5);
  ctx.stroke();

  // Pink umbrella held in the right hand
  ctx.strokeStyle = '#e88aa8';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(17, -2);
  ctx.lineTo(18, -22);
  ctx.stroke();
  ctx.fillStyle = '#e0b090';
  ctx.beginPath();
  ctx.arc(17, -2, 3, 0, TAU);
  ctx.fill();

  // Big head: face, then wild black hair around the back and sides
  ctx.fillStyle = '#e0b090';
  ctx.beginPath();
  ctx.arc(0, -9, 11.5, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#15110e';
  for (let i = 0; i < 10; i++) {
    const a = Math.PI * (0.02 + i * 0.107);
    ctx.beginPath();
    ctx.arc(Math.cos(a) * 11.5, Math.sin(a) * 11.5, 4.5, 0, TAU);
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(0, 0, 12.5, 0, TAU);
  ctx.fill();

  // Bushy beard along the front of the face
  ctx.fillStyle = '#2a1d12';
  for (let j = 0; j < 7; j++) {
    const a = -Math.PI * (0.17 + j * 0.11);
    ctx.beginPath();
    ctx.arc(Math.cos(a) * 11.5, -9 + Math.sin(a) * 11.5, 4.2, 0, TAU);
    ctx.fill();
  }

  // Beetle-black eyes
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-3.8, -15.5, 1.3, 0, TAU);
  ctx.arc(3.8, -15.5, 1.3, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-3.4, -15.9, 0.4, 0, TAU);
  ctx.arc(4.2, -15.9, 0.4, 0, TAU);
  ctx.fill();

  ctx.restore();
}

function drawEnemy(e) {
  if (e.kind === 'hagrid') drawHagrid(e);
  else drawHermione(e);
}

function drawMonster(m) {
  const bob = Math.sin(m.t) * 6;
  ctx.save();
  ctx.translate(m.x, m.y - 30 + bob);

  // Wobbly purple body
  ctx.fillStyle = '#8e2de2';
  ctx.beginPath();
  for (let i = 0; i <= 24; i++) {
    const a = (i / 24) * TAU;
    const r = 17 + Math.sin(a * 6 + m.t * 3) * 2.2;
    if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath();
  ctx.fill();

  // Glowing yellow eyes
  ctx.fillStyle = '#ffe600';
  ctx.beginPath();
  ctx.arc(-6, -4, 4.5, 0, TAU);
  ctx.arc(6, -4, 4.5, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.fillRect(-7, -5, 3, 3);
  ctx.fillRect(5, -5, 3, 3);

  // Toothy mouth
  ctx.fillStyle = '#300';
  ctx.beginPath();
  ctx.arc(0, 5, 6, 0, Math.PI);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillRect(-4, 5, 3, 3);
  ctx.fillRect(2, 5, 3, 3);

  ctx.restore();
}

// Semi-realistic Malfoy seen from directly above, 8 heads tall (wide shoulders, small head).
// The sprite is drawn facing up and rotated toward the movement direction.
function drawMalfoy(p) {
  const swing = p.z > 0 ? 5 : (p.moving ? Math.sin(p.step) * 5 : 0);
  const scale = 1 + p.z * 0.004;

  ctx.save();
  ctx.translate(p.x, p.y - p.z * 0.8);
  ctx.scale(scale, scale);
  ctx.rotate(p.face + Math.PI / 2);
  ctx.lineCap = 'round';

  // Shoes peeking out from under the robe
  ctx.fillStyle = '#060608';
  ctx.beginPath();
  ctx.ellipse(-4.5, 9 + swing, 3.4, 5.2, 0, 0, TAU);
  ctx.ellipse(4.5, 9 - swing, 3.4, 5.2, 0, 0, TAU);
  ctx.fill();

  // Black robe over the wide shoulders, with a green lining seam down the back
  const robe = ctx.createRadialGradient(-3, -3, 2, 0, 0, 15);
  robe.addColorStop(0, '#34343f');
  robe.addColorStop(1, '#0b0b10');
  ctx.fillStyle = robe;
  ctx.beginPath();
  ctx.ellipse(0, 1, 13, 8.5, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = '#1d6b44';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(0, 2);
  ctx.lineTo(0, 9.4);
  ctx.stroke();

  // Arms swinging forward, wand in the right hand
  const armL = -8 + swing * 0.3;
  const armR = -8 - swing * 0.3;
  ctx.strokeStyle = '#1a1a21';
  ctx.lineWidth = 4.5;
  ctx.beginPath();
  ctx.moveTo(-11, 0);
  ctx.lineTo(-12, armL);
  ctx.moveTo(11, 0);
  ctx.lineTo(12, armR);
  ctx.stroke();
  ctx.fillStyle = '#f1d3be';
  ctx.beginPath();
  ctx.arc(-12, armL - 2, 2.3, 0, TAU);
  ctx.arc(12, armR - 2, 2.3, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = '#6b4423';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(12, armR - 2);
  ctx.lineTo(12.5, armR - 14);
  ctx.stroke();
  ctx.fillStyle = '#cfe8ff';
  ctx.beginPath();
  ctx.arc(12.5, armR - 14.5, 1.3, 0, TAU);
  ctx.fill();

  // Head: skin, ears and nose tip at the front
  const skin = ctx.createRadialGradient(0, -3, 1, 0, -1, 7);
  skin.addColorStop(0, '#fbe6d6');
  skin.addColorStop(1, '#d9ae93');
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.arc(0, -1, 6.3, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#e4bca5';
  ctx.beginPath();
  ctx.ellipse(-6.3, -0.5, 1.5, 2.2, 0, 0, TAU);
  ctx.ellipse(6.3, -0.5, 1.5, 2.2, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#f1cdb8';
  ctx.beginPath();
  ctx.ellipse(0, -7.6, 1.6, 2.1, 0, 0, TAU);
  ctx.fill();

  // Platinum blond slicked-back hair covering the back of the head
  const hair = ctx.createRadialGradient(0, 2, 1, 0, 1, 8);
  hair.addColorStop(0, '#fbf6dc');
  hair.addColorStop(1, '#c9c095');
  ctx.fillStyle = hair;
  ctx.beginPath();
  ctx.arc(0, 1.2, 6.4, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(140, 130, 90, 0.55)';
  ctx.lineWidth = 0.6;
  ctx.beginPath();
  for (let i = -2; i <= 2; i++) {
    ctx.moveTo(i * 1.6, -4.6);
    ctx.quadraticCurveTo(i * 2.4, 1, i * 1.8, 6.8);
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
  ctx.lineWidth = 0.9;
  ctx.beginPath();
  ctx.arc(0, 1.2, 6, -Math.PI * 0.8, -Math.PI * 0.2);
  ctx.stroke();

  ctx.restore();

  // Name tag (not rotated)
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('TS 말포이', p.x, p.y - p.z * 0.8 - 30);
}

function draw() {
  cameraX = clamp(player.x - W / 2, 0, WORLD_W - W);
  cameraY = clamp(player.y - H / 2, 0, WORLD_H - H);

  ctx.save();
  ctx.translate(-cameraX, -cameraY);

  drawGround();
  for (const r of pits) drawPit(r);

  // Shadows first so everything stands on top of them
  for (const e of enemies) if (e.alive) drawShadow(e.x, e.y + 4, e.r - 1, 0);
  for (const m of monsters) drawShadow(m.x, m.y, 15, 30);
  drawShadow(player.x, player.y + 4, 12, player.z);

  // Draw back to front by ground position
  const items = [];
  for (const r of rocks) items.push({ key: r.y + r.h, draw: () => drawRock(r) });
  items.push({ key: flag.y, draw: drawFlag });
  for (const e of enemies) if (e.alive) items.push({ key: e.y, draw: () => drawEnemy(e) });
  items.push({ key: player.y, draw: () => drawMalfoy(player) });
  for (const m of monsters) items.push({ key: m.y + 1000, draw: () => drawMonster(m) });
  items.sort((a, b) => a.key - b.key);
  for (const item of items) item.draw();

  ctx.restore();

  if (won) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 32px sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
    ctx.shadowBlur = 8;
    ctx.fillText('CLEAR! R 키로 다시 시작', W / 2, H / 2);
    ctx.shadowBlur = 0;
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

reset();
loop();
</script>
